name: Build murderbot-llm

on:
  push:
    branches: [main]
    paths:
      - 'images/murderbot-llm/**'
      - '.github/workflows/murderbot-llm.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'images/murderbot-llm/**'
      - '.github/workflows/murderbot-llm.yaml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dean-amer-dev/murderbot-llm

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable tag
        id: tag
        run: |
          ninfer_ref=$(sed -n 's/^ARG NINFER_REF=//p' images/murderbot-llm/Dockerfile)
          echo "tag=ninfer-${ninfer_ref::7}-sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx (in-pod BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: unix:///run/buildkit/buildkitd.sock

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        if: github.event_name != 'pull_request'
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ steps.tag.outputs.tag }} already exists; tags are immutable"
            exit 1
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./images/murderbot-llm
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

      - name: Record digest
        if: github.event_name != 'pull_request'
        run: echo "${IMAGE}:${{ steps.tag.outputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
